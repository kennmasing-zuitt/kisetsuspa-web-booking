# kisetsuspa.com (+ www) -> booking site at /book/
#
# Server block for the shared Dockerized Nginx proxy. Copy it into the proxy's conf.d/
# (next to scheduling.conf and scheduling-api.conf). Port 80 / HTTP->HTTPS is handled by the
# proxy's shared 00-http.conf.

server {
    listen 443 ssl;
    http2 on;
    server_name kisetsuspa.com www.kisetsuspa.com;

    # One certificate for kisetsuspa.com, www., scheduling. and scheduling-api. (deploy/README.md)
    ssl_certificate     /etc/letsencrypt/live/kisetsuspa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kisetsuspa/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    set $booking http://kisetsu-booking-client:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The booking site
    location /book/ {
        proxy_pass $booking;
    }
    location = /book {
        return 301 /book/;
    }

    # The spa's main website goes here later. Until then, send visitors to booking.
    location / {
        return 302 /book/;
    }
}
