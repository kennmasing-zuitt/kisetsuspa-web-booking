# Inside the kisetsu-booking-client container: serves the static export at /book/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets never change: cache for a year
    location /book/_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /book/ {
        # /book/setup/ -> /book/setup/index.html (trailingSlash export)
        try_files $uri $uri/ $uri.html /book/404.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location = /book {
        return 301 /book/;
    }
}
